# Installed by umoja-desktop. Applies to every app-*.service, which includes
# the app-*@autostart.service units systemd-xdg-autostart-generator makes.
# Ordering only matters when umoja-tray-ready.service is started in the same
# transaction, i.e. at Umoja login: autostart apps then wait until the
# panel's tray is up. In other sessions (GNOME) that unit isn't involved,
# so this does nothing.
[Unit]
After=umoja-tray-ready.service
