# Portal backend selection when XDG_CURRENT_DESKTOP starts with "Umoja".
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Settings=umoja;gnome;gtk;
org.freedesktop.impl.portal.Screenshot=umoja;
# Screen and window sharing, remote desktop and input capture: GNOME's
# portal and picker, backed by umoja-mir's org.gnome.Mutter.ScreenCast,
# RemoteDesktop, InputCapture and org.gnome.Shell.Introspect.
org.freedesktop.impl.portal.ScreenCast=gnome;
org.freedesktop.impl.portal.RemoteDesktop=gnome;
org.freedesktop.impl.portal.InputCapture=gnome;
org.freedesktop.impl.portal.Secret=gnome-keyring;
