[package]
name = "umoja-common"
description = "Shared GSettings, D-Bus, i18n and type helpers for Umoja"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
gio.workspace = true
glib.workspace = true
gettext-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gtk4 = { workspace = true, optional = true }
gdk4-wayland = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true }
wayland-backend = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }

[features]
# Compositor blur behind GTK windows and popovers (ext-background-effect-v1).
blur = ["dep:gtk4", "dep:gdk4-wayland", "dep:wayland-client", "dep:wayland-backend", "dep:wayland-protocols"]
