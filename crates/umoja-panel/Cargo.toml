[package]
name = "umoja-panel"
description = "Umoja top panel: clock, AppIndicators and Quick Settings"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
umoja-common = { workspace = true, features = ["blur", "monitors", "icons"] }
gtk4.workspace = true
libadwaita.workspace = true
gtk4-layer-shell.workspace = true
gio.workspace = true
glib.workspace = true
tracing.workspace = true
libc.workspace = true
gtk4-session-lock.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
# The PulseAudio client API (served by pipewire-pulse), as gnome-shell's
# libgvc uses it for volume, devices and recording streams.
libpulse-binding = "2.28"
libpulse-glib-binding = "2.28"
