[package]
name = "umoja-overlay"
description = "Umoja overlay: app grid, Lemonade AI search and Myna dictation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
umoja-common = { workspace = true, features = ["blur"] }
gtk4.workspace = true
libadwaita.workspace = true
gtk4-layer-shell.workspace = true
gio.workspace = true
glib.workspace = true
tracing.workspace = true
async-channel.workspace = true
tokio.workspace = true
# HTTPS for the optional cloud model; the system CA store is used.
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
libc.workspace = true
