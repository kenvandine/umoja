[package]
name = "umoja-agentd"
description = "Umoja's agent service: Hermes in an OpenShell sandbox, approvals and runs over D-Bus"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openshell-gateway-client = { workspace = true }
libc = "0.2"
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
