# What Hermes's processes may touch inside the sandbox (Landlock).
# Network: nothing here; Umoja adds endpoints as the user allows them.
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/bin, /sbin, /usr, /lib, /lib64, /opt, /etc, /proc, /dev/urandom, /var/log]
  read_write: [/sandbox, /tmp, /dev/null, /dev/shm, /dev/pts, /dev/tty]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox
