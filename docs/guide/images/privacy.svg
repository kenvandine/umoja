<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="What stays on your computer">
<title>What stays on your computer</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="1" y="1" width="998" height="468" rx="18" fill="#fbf9f8" stroke="#d8d2cf" stroke-width="2"/>
<text x="500" y="38.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Where your requests go</text>
<rect x="40" y="70" width="600" height="370" rx="16" fill="#ffffff" stroke="#77216F" stroke-width="3" />
<text x="340" y="100.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#77216F" font-weight="bold" text-anchor="middle" dominant-baseline="central">Your computer</text>
<rect x="70" y="125" width="540" height="50" rx="12" fill="#ffffff" stroke="#d8d2cf" stroke-width="2" />
<text x="340.0" y="150.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central"></text>
<text x="90" y="150.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2c2c2c" font-weight="bold" text-anchor="start" dominant-baseline="central">Local AI model</text>
<text x="590" y="150.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="end" dominant-baseline="central">assistant, digests, replies, crash help</text>
<rect x="70" y="185" width="540" height="50" rx="12" fill="#ffffff" stroke="#d8d2cf" stroke-width="2" />
<text x="340.0" y="210.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central"></text>
<text x="90" y="210.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2c2c2c" font-weight="bold" text-anchor="start" dominant-baseline="central">Whisper</text>
<text x="590" y="210.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="end" dominant-baseline="central">live captions</text>
<rect x="70" y="245" width="540" height="50" rx="12" fill="#ffffff" stroke="#d8d2cf" stroke-width="2" />
<text x="340.0" y="270.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central"></text>
<text x="90" y="270.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2c2c2c" font-weight="bold" text-anchor="start" dominant-baseline="central">OCR</text>
<text x="590" y="270.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="end" dominant-baseline="central">copy text, screenshot names</text>
<rect x="70" y="305" width="540" height="50" rx="12" fill="#ffffff" stroke="#d8d2cf" stroke-width="2" />
<text x="340.0" y="330.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central"></text>
<text x="90" y="330.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2c2c2c" font-weight="bold" text-anchor="start" dominant-baseline="central">File index</text>
<text x="590" y="330.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="end" dominant-baseline="central">find files by what they&#x27;re about</text>
<rect x="70" y="365" width="540" height="50" rx="12" fill="#ffffff" stroke="#d8d2cf" stroke-width="2" />
<text x="340.0" y="390.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central"></text>
<text x="90" y="390.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2c2c2c" font-weight="bold" text-anchor="start" dominant-baseline="central">Activity timeline</text>
<text x="590" y="390.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="end" dominant-baseline="central">only if you turn it on</text>
<rect x="700" y="150" width="260" height="150" rx="16" fill="#f3e9e4" stroke="#d8d2cf" stroke-width="2" />
<text x="830" y="190.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Cloud model</text>
<text x="830" y="211.2" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">Only if you choose it,</text>
<text x="830" y="230.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">only the assistant&#x27;s</text>
<text x="830" y="248.8" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">conversation</text>
<line x1="612" y1="150" x2="696" y2="200" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="7 6"/>
<text x="830" y="330.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#77216F" font-weight="bold" text-anchor="middle" dominant-baseline="central">Everything else never</text>
<text x="830" y="350.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#77216F" font-weight="bold" text-anchor="middle" dominant-baseline="central">leaves the computer.</text>
</svg>
