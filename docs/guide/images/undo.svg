<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Undo">
<title>Undo</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="1" y="1" width="998" height="248" rx="18" fill="#fbf9f8" stroke="#d8d2cf" stroke-width="2"/>
<text x="500" y="38.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Every change the assistant makes can be put back</text>
<rect x="40" y="80" width="250" height="110" rx="12" fill="#ffffff" stroke="#d8d2cf" stroke-width="2" />
<text x="165.0" y="125.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">“make it dark,</text>
<text x="165.0" y="145.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">turn the volume to 20”</text>
<line x1="295" y1="135" x2="345" y2="135" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="350" y="80" width="240" height="110" rx="12" fill="#f3e9e4" stroke="#d8d2cf" stroke-width="2" />
<text x="470.0" y="121.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Done</text>
<text x="470.0" y="141.6" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">✓ Dark Style  ✓ Volume 20%</text>
<text x="470.0" y="160.4" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">[ Undo ]</text>
<line x1="595" y1="135" x2="725" y2="135" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="660.0" y="121.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central" font-style="italic">Undo, or “undo”</text>
<rect x="730" y="80" width="230" height="110" rx="12" fill="#ffffff" stroke="#E95420" stroke-width="2" />
<text x="845.0" y="121.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Back as it was</text>
<text x="845.0" y="151.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">light style, volume 65%</text>
<text x="500" y="222.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">Settings, volume, brightness, Wi-Fi, Bluetooth, power mode and window moves are remembered for a day.</text>
</svg>
