<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Automations">
<title>Automations</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="1" y="1" width="998" height="428" rx="18" fill="#fbf9f8" stroke="#d8d2cf" stroke-width="2"/>
<text x="500" y="38.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Automations: When something happens, do this</text>
<text x="500" y="74.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central" font-style="italic">Say it in Ask Umoja: “when I plug in my monitor, open my Coding setup and turn on dark style”</text>
<rect x="40" y="110" width="280" height="260" rx="12" fill="#ffffff" stroke="#E95420" stroke-width="2" />
<text x="180.0" y="240.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central"></text>
<text x="180" y="135.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#E95420" font-weight="bold" text-anchor="middle" dominant-baseline="central">When…</text>
<text x="60" y="168.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• I log in</text>
<text x="60" y="197.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• it&#x27;s 9:00 on weekdays</text>
<text x="60" y="226.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• a monitor is plugged in</text>
<text x="60" y="255.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• the charger is unplugged</text>
<text x="60" y="284.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• I join “Home Wi-Fi”</text>
<text x="60" y="313.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• Spotify opens</text>
<text x="60" y="342.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• my headphones connect</text>
<line x1="325" y1="240" x2="395" y2="240" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="400" y="110" width="280" height="260" rx="12" fill="#ffffff" stroke="#77216F" stroke-width="2" />
<text x="540.0" y="240.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central"></text>
<text x="540" y="135.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#77216F" font-weight="bold" text-anchor="middle" dominant-baseline="central">Do…</text>
<text x="420" y="168.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• open a setup or apps</text>
<text x="420" y="197.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• dark style, Night Light</text>
<text x="420" y="226.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• Do Not Disturb</text>
<text x="420" y="255.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• volume, brightness</text>
<text x="420" y="284.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• power mode</text>
<text x="420" y="313.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• Wi-Fi, Bluetooth</text>
<text x="420" y="342.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c2c2c" font-weight="normal" text-anchor="start" dominant-baseline="central">• show a reminder</text>
<rect x="720" y="110" width="240" height="120" rx="12" fill="#f3e9e4" stroke="#d8d2cf" stroke-width="2" />
<text x="840.0" y="156.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">You confirm once</text>
<text x="840.0" y="176.6" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">Umoja shows the rule</text>
<text x="840.0" y="195.4" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">before saving it</text>
<rect x="720" y="250" width="240" height="120" rx="12" fill="#f3e9e4" stroke="#d8d2cf" stroke-width="2" />
<text x="840.0" y="296.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Then it just runs</text>
<text x="840.0" y="316.6" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">even with Ask Umoja</text>
<text x="840.0" y="335.4" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">closed</text>
<text x="500" y="400.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">Only low-risk actions can be automated: nothing that deletes, installs or logs you out.</text>
</svg>
