<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="Automatic Do Not Disturb">
<title>Automatic Do Not Disturb</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="1" y="1" width="998" height="288" rx="18" fill="#fbf9f8" stroke="#d8d2cf" stroke-width="2"/>
<text x="500" y="38.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Notifications wait while you&#x27;re presenting or playing</text>
<rect x="40" y="80" width="260" height="110" rx="12" fill="#ffffff" stroke="#d8d2cf" stroke-width="2" />
<text x="170.0" y="121.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Recording the screen</text>
<text x="170.0" y="151.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">with the screenshot tool</text>
<rect x="40" y="200" width="260" height="70" rx="12" fill="#ffffff" stroke="#d8d2cf" stroke-width="2" />
<text x="170.0" y="235.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">A fullscreen window</text>
<line x1="305" y1="170" x2="355" y2="170" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="360" y="110" width="240" height="120" rx="12" fill="#f3e9e4" stroke="#E95420" stroke-width="2" />
<text x="480.0" y="156.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Banners wait</text>
<text x="480.0" y="176.6" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">they still go to</text>
<text x="480.0" y="195.4" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">the message list</text>
<line x1="605" y1="170" x2="715" y2="170" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="660.0" y="156.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central" font-style="italic">afterwards</text>
<rect x="720" y="110" width="240" height="120" rx="12" fill="#ffffff" stroke="#d8d2cf" stroke-width="2" />
<text x="840.0" y="156.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">One summary</text>
<text x="840.0" y="176.6" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">“3 notifications</text>
<text x="840.0" y="195.4" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">while you were busy”</text>
</svg>
