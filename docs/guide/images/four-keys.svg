<text x="380" y="230.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="start" dominant-baseline="central">a selection, the screen or a window; or record</text>
<rect x="60" y="260" width="65" height="36" rx="7" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.6"/>
