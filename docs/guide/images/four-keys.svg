<text x="161.78" y="97.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="start" dominant-baseline="central" font-style="italic">or tap Alt</text>
<line x1="300" y1="98" x2="360" y2="98" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)"/>
