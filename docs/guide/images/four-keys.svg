<text x="380" y="148.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#77216F" font-weight="bold" text-anchor="start" dominant-baseline="central">Activities overview</text>
