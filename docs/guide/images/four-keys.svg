<line x1="300" y1="278" x2="360" y2="278" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="380" y="268.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#77216F" font-weight="bold" text-anchor="start" dominant-baseline="central">Shortcuts guide</text>
<text x="380" y="290.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="start" dominant-baseline="central">every keyboard shortcut, searchable</text>
