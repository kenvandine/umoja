<text x="133.7" y="277.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">+</text>
<rect x="142.7" y="260" width="44" height="36" rx="7" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.6"/>
