<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Rewrite selected text">
<title>Rewrite selected text</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="1" y="1" width="998" height="268" rx="18" fill="#fbf9f8" stroke="#d8d2cf" stroke-width="2"/>
<text x="500" y="38.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Rewrite text in any app</text>
<rect x="40" y="80" width="240" height="120" rx="12" fill="#ffffff" stroke="#d8d2cf" stroke-width="2" />
<text x="160.0" y="126.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">1. Select text</text>
<text x="160.0" y="156.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">in mail, chat, a doc</text>
<line x1="285" y1="140" x2="345" y2="140" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="350" y="80" width="300" height="120" rx="12" fill="#f3e9e4" stroke="#d8d2cf" stroke-width="2" />
<text x="500.0" y="126.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">2. Open Ask Umoja</text>
<text x="500.0" y="146.6" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">Fix spelling · Shorter · Friendlier</text>
<text x="500.0" y="165.4" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">More formal · Translate · your own</text>
<line x1="655" y1="140" x2="715" y2="140" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="720" y="80" width="240" height="120" rx="12" fill="#ffffff" stroke="#E95420" stroke-width="2" />
<text x="840.0" y="126.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">3. Replace</text>
<text x="840.0" y="146.6" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">the new text is typed</text>
<text x="840.0" y="165.4" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">in place of yours</text>
<text x="500" y="236.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">Uses the assistant&#x27;s model; with a local model the text never leaves the computer.</text>
</svg>
