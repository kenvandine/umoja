<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="How Ask Umoja works">
<title>How Ask Umoja works</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="1" y="1" width="998" height="518" rx="18" fill="#fbf9f8" stroke="#d8d2cf" stroke-width="2"/>
<text x="500" y="38.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">What happens when you type into Ask Umoja</text>
<rect x="380" y="70" width="240" height="70" rx="12" fill="#ffffff" stroke="#E95420" stroke-width="2" />
<text x="500.0" y="91.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">You type</text>
<text x="500.0" y="121.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">“dark”, “12*7”, “party”…</text>
<line x1="450" y1="140" x2="220" y2="200" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="550" y1="140" x2="780" y2="200" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="40" y="205" width="360" height="120" rx="12" fill="#f3e9e4" stroke="#d8d2cf" stroke-width="2" />
<text x="220.0" y="251.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Instant rows</text>
<text x="220.0" y="271.6" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">apps · switches · Settings pages</text>
<text x="220.0" y="290.4" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">sums · emoji · files · setups</text>
<text x="220" y="345.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central" font-style="italic">No AI model involved: well under a second</text>
<rect x="600" y="205" width="360" height="120" rx="12" fill="#f3e9e4" stroke="#d8d2cf" stroke-width="2" />
<text x="780.0" y="251.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Ask Umoja row (or Tab)</text>
<text x="780.0" y="281.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">the assistant reads your request</text>
<line x1="780" y1="325" x2="780" y2="380" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="600" y="385" width="360" height="60" rx="12" fill="#ffffff" stroke="#d8d2cf" stroke-width="2" />
<text x="780.0" y="415.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Uses desktop tools</text>
<text x="780" y="465.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#77216F" font-weight="bold" text-anchor="middle" dominant-baseline="central">Asks first before anything that matters</text>
<text x="780" y="490.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central">Shows each step, with Undo when it can</text>
<line x1="400" y1="265" x2="595" y2="265" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="7 6"/>
<text x="497.5" y="251.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b6b6b" font-weight="normal" text-anchor="middle" dominant-baseline="central" font-style="italic">Tab hands a row to it</text>
<rect x="40" y="385" width="360" height="60" rx="12" fill="#ffffff" stroke="#d8d2cf" stroke-width="2" />
<text x="220.0" y="415.0" font-family="Ubuntu, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2c2c2c" font-weight="bold" text-anchor="middle" dominant-baseline="central">Enter runs the row</text>
<line x1="220" y1="325" x2="220" y2="380" stroke="#6b6b6b" stroke-width="2.5" marker-end="url(#ah)"/>
</svg>
