# Build the Hermes sandbox image umoja-agentd runs in OpenShell
# (agents/hermes-image) and push it to ghcr.io/kenvandine/umoja-hermes.
#
# - Pushes to main that touch agents/hermes-image publish :latest and :<sha>;
#   pushes to claude/* branches publish :<sha> only (device tests).
#   agents/catalog/hermes.json names an exact :<sha>; move it with
#   packaging/bump-agent-image once a new image is published.
# - A weekly run picks up a new upstream Hermes Agent image.
# - Pull requests only build.
#
# The package must be public (GitHub > Packages > umoja-hermes > settings)
# so the LXD driver can pull it without credentials.

name: Hermes image

on:
  push:
    # claude/* work branches publish :<sha> only, for testing on a device.
    branches: [main, "claude/**"]
    paths: ["agents/hermes-image/**", ".github/workflows/hermes-image.yml"]
  pull_request:
    paths: ["agents/hermes-image/**", ".github/workflows/hermes-image.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hermes-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the bridge script
        run: python3 -m py_compile agents/hermes-image/umoja-agent-bridge && sh -n agents/hermes-image/umoja-agent-start
      - name: Build (and push)
        uses: docker/build-push-action@v6
        with:
          context: agents/hermes-image
          file: agents/hermes-image/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/kenvandine/umoja-hermes:latest' || '' }}
            ghcr.io/kenvandine/umoja-hermes:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
