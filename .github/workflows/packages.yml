# Build Debian packages and publish them to ppa:ken-vandine/umoja.
#
# - Pull requests: build binary .debs in the target Ubuntu release (no upload).
# - Pushes to main: upload a snapshot. After v2026.46.1 is tagged that is
#   2026.46.1+git<date>.<sha>~<series>1; while debian/changelog names a
#   version not tagged yet it is 2026.46.1~git<date>.<sha>~<series>1, so the
#   release still sorts above it.
# - Tags v*: upload that release (e.g. v2026.46.1 -> 2026.46.1~<series>1).
#   Versions are vYYYY.WW.REVISION (ISO week); packaging/bump-version makes one.
# - Manual runs: pick the series and whether to upload. With "release" the
#   debian/changelog version is uploaded as a release and tagged v<version>.
#
# Launchpad builds offline, so the source package carries vendored crates
# and the embedded Lemonade build (`make vendor`).
#
# Required repository secrets:
#   PPA_GPG_PRIVATE_KEY  ASCII-armoured secret key registered with Launchpad
#   PPA_GPG_PASSPHRASE   its passphrase (may be empty)
#   PPA_SIGNER_NAME      name on that key, e.g. "Ken VanDine"
#   PPA_SIGNER_EMAIL     email on that key (must match a Launchpad-verified address)

name: Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      series:
        description: Ubuntu series to target
        default: stonking
      image:
        description: Docker image for that series
        default: ubuntu:26.10
      upload:
        description: Upload the source package to the PPA
        type: boolean
        default: true
      release:
        description: Upload the debian/changelog version as a release and tag it
        type: boolean
        default: false

env:
  SERIES: ${{ inputs.series || 'stonking' }}
  IMAGE: ${{ inputs.image || 'ubuntu:26.10' }}
  PPA: ppa:ken-vandine/umoja
  DEBIAN_FRONTEND: noninteractive

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary:
    name: Build .debs (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.10
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git devscripts equivs build-essential lintian

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' debian/control

      - name: Vendor crates and Lemonade
        run: make vendor LEMONADE_ARCHES=${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}

      - name: Build
        run: dpkg-buildpackage -b -us -uc

      - name: Collect
        run: |
          mkdir -p dist
          mv ../*.deb ../*.buildinfo ../*.changes dist/

      - name: Lint
        run: lintian --no-tag-display-limit dist/*.changes || true

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  install-test:
    name: Install test (${{ matrix.arch }})
    needs: binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: dist

      # Stock ubuntu-desktop-minimal with Recommends, then our debs, then a
      # headless session with screenshots (see tests/install-test.sh).
      - name: Install on ubuntu-desktop-minimal and run headless
        run: tests/install-test.sh dist install-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-test-${{ matrix.arch }}
          path: install-test/

  ppa:
    name: Upload to PPA
    needs: binary
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.upload)
    runs-on: ubuntu-24.04
    container: ${{ inputs.image || 'ubuntu:26.10' }}
    permissions:
      contents: write
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git devscripts dput gnupg \
            debhelper cargo rustc pkgconf

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        shell: bash
        run: |
          # The container runs as root, the checkout belongs to the runner.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=$(dpkg-parsechangelog -S Version | sed 's/[~+].*//')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$base" ]]; then
              echo "::error::Tag v$tag does not match debian/changelog ($base); run packaging/bump-version --tag"
              exit 1
            fi
            version="${tag}~${SERIES}1"
          elif [[ "${{ inputs.release }}" == "true" ]]; then
            if git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then
              echo "::error::v$base is already tagged; run packaging/bump-version first"
              exit 1
            fi
            version="${base}~${SERIES}1"
            echo "tag=v$base" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then
            stamp=$(git log -1 --format=%cd --date=format:%Y%m%d%H%M)
            version="${base}~git${stamp}.$(git rev-parse --short=8 HEAD)~${SERIES}1"
          else
            stamp=$(git log -1 --format=%cd --date=format:%Y%m%d%H%M)
            version="${base}+git${stamp}.$(git rev-parse --short=8 HEAD)~${SERIES}1"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging $version for $SERIES"

      - name: Import signing key
        id: gpg
        env:
          KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          test -n "$KEY" || { echo "::error::PPA_GPG_PRIVATE_KEY secret is not set"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          printf '%s' "$PASSPHRASE" > "$RUNNER_TEMP/passphrase"
          printf '%s\n' "$KEY" | gpg --batch --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "keyid=$keyid" >> "$GITHUB_OUTPUT"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Update changelog
        env:
          DEBFULLNAME: ${{ secrets.PPA_SIGNER_NAME }}
          DEBEMAIL: ${{ secrets.PPA_SIGNER_EMAIL }}
        run: |
          dch --newversion "${{ steps.version.outputs.version }}" \
              --distribution "$SERIES" --force-distribution --force-bad-version \
              "Automated build of ${GITHUB_SHA} (${GITHUB_REF_NAME})."

      - name: Vendor crates and Lemonade
        run: |
          cargo install --locked cargo-vendor-filterer || true
          export PATH="$HOME/.cargo/bin:$PATH"
          make vendor

      - name: Build source package
        run: dpkg-buildpackage -S -sa -d -us -uc

      - name: Sign
        run: |
          debsign -k"${{ steps.gpg.outputs.keyid }}" \
            -p"gpg --batch --pinentry-mode loopback --passphrase-file $RUNNER_TEMP/passphrase" \
            ../umoja-desktop_*_source.changes

      - name: Upload to Launchpad
        run: dput "$PPA" ../umoja-desktop_*_source.changes

      - name: Tag the release
        if: steps.version.outputs.tag != ''
        run: |
          git tag "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Collect
        if: always()
        run: |
          mkdir -p dist
          mv ../umoja-desktop_*.dsc ../umoja-desktop_*.tar.* ../umoja-desktop_*_source.* dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: dist/

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg" "$RUNNER_TEMP/passphrase"
