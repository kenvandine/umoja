# Build Debian packages and publish them to Launchpad.
#
# - Pull requests: build binary .debs in the target Ubuntu release (no upload).
# - Releases go to ppa:ken-vandine/umoja: a pushed v* tag (e.g. v2026.46.1 ->
#   2026.46.1~<series>1), or a manual run with "release" (below).
#   Versions are vYYYY.WW.REVISION (ISO week); packaging/bump-version makes one.
# - Everything else (pushes to main, manual runs without "release") goes to
#   ppa:ken-vandine/umoja-edge, which depends on ppa:ken-vandine/umoja.
#   Edge versions are the latest release tag plus the commits since it:
#   2026.46.3+git<N>.<sha>~<series>1, so they always sort above that
#   release and below the next one. An edge upload waits until Launchpad has
#   no umoja-desktop build in flight in the edge PPA: uploading a newer
#   version supersedes the old source, and the old build's binaries are then
#   rejected ("Unable to find source publication ..."). A newer push cancels
#   the waiting run, so only the latest main is uploaded.
# - Every run builds the user guide PDF (artifact "user-guide"); releases
#   attach it to the GitHub release for their tag.
# - Manual runs: pick the series and whether to upload. With "release" the
#   debian/changelog version is uploaded as a release and tagged v<version>.
#
# Launchpad builds offline, so the source package carries vendored crates
# and the embedded Lemonade build (`make vendor`).
#
# The "Meta package lists" job warns when Ubuntu's ubuntu-desktop-minimal
# changes, so ubuntu-umoja-desktop can follow (packaging/meta/update).
#
# Required repository secrets:
#   PPA_GPG_PRIVATE_KEY  ASCII-armoured secret key registered with Launchpad
#   PPA_GPG_PASSPHRASE   its passphrase (may be empty)
#   PPA_SIGNER_NAME      name on that key, e.g. "Ken VanDine"
#   PPA_SIGNER_EMAIL     email on that key (must match a Launchpad-verified address)

name: Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      series:
        description: Ubuntu series to target
        default: stonking
      image:
        description: Docker image for that series
        default: ubuntu:26.10
      upload:
        description: Upload the source package to the PPA
        type: boolean
        default: true
      release:
        description: Upload the debian/changelog version as a release and tag it
        type: boolean
        default: false

env:
  SERIES: ${{ inputs.series || 'stonking' }}
  IMAGE: ${{ inputs.image || 'ubuntu:26.10' }}
  RELEASE_PPA: ppa:ken-vandine/umoja
  EDGE_PPA: ppa:ken-vandine/umoja-edge
  DEBIAN_FRONTEND: noninteractive

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Meta package lists
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare with Ubuntu's ubuntu-desktop-minimal
        run: packaging/meta/update --check --series "$SERIES"

  binary:
    name: Build .debs (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.10
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git devscripts equivs build-essential lintian

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' debian/control

      - name: Vendor crates and Lemonade
        run: make vendor LEMONADE_ARCHES=${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}

      - name: Build
        run: dpkg-buildpackage -b -us -uc

      - name: Collect
        run: |
          mkdir -p dist
          mv ../*.deb ../*.buildinfo ../*.changes dist/

      - name: Lint
        run: lintian --no-tag-display-limit dist/*.changes || true

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  install-test:
    name: Install test (${{ matrix.arch }})
    needs: binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: dist

      # ubuntu-umoja-desktop with Recommends (no GNOME Shell), then a
      # headless session with screenshots (see tests/install-test.sh).
      - name: Install ubuntu-umoja-desktop and run headless
        run: tests/install-test.sh dist install-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-test-${{ matrix.arch }}
          path: install-test/

  ppa:
    name: Upload to PPA
    needs: binary
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.upload)
    runs-on: ubuntu-24.04
    container: ${{ inputs.image || 'ubuntu:26.10' }}
    timeout-minutes: 330
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git devscripts dput gnupg \
            debhelper cargo rustc pkgconf python3

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        shell: bash
        run: |
          # The container runs as root, the checkout belongs to the runner.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=$(dpkg-parsechangelog -S Version | sed 's/[~+].*//')
          ppa="$RELEASE_PPA"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$base" ]]; then
              echo "::error::Tag v$tag does not match debian/changelog ($base); run packaging/bump-version --tag"
              exit 1
            fi
            version="${tag}~${SERIES}1"
            echo "release=v$tag" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.release }}" == "true" ]]; then
            if git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then
              echo "::error::v$base is already tagged; run packaging/bump-version first"
              exit 1
            fi
            version="${base}~${SERIES}1"
            echo "tag=v$base" >> "$GITHUB_OUTPUT"
            echo "release=v$base" >> "$GITHUB_OUTPUT"
          else
            # Edge: latest release tag reachable from HEAD plus commits since.
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
            if [[ -z "$last" ]]; then
              echo "::error::No v* release tag found to base the edge version on"
              exit 1
            fi
            count=$(git rev-list --count "$last..HEAD")
            version="${last#v}+git${count}.$(git rev-parse --short=8 HEAD)~${SERIES}1"
            ppa="$EDGE_PPA"
          fi
          echo "ppa=$ppa" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging $version for $SERIES -> $ppa"

      - name: Import signing key
        id: gpg
        env:
          KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          test -n "$KEY" || { echo "::error::PPA_GPG_PRIVATE_KEY secret is not set"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          printf '%s' "$PASSPHRASE" > "$RUNNER_TEMP/passphrase"
          printf '%s\n' "$KEY" | gpg --batch --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "keyid=$keyid" >> "$GITHUB_OUTPUT"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Update changelog
        env:
          DEBFULLNAME: ${{ secrets.PPA_SIGNER_NAME }}
          DEBEMAIL: ${{ secrets.PPA_SIGNER_EMAIL }}
        run: |
          dch --newversion "${{ steps.version.outputs.version }}" \
              --distribution "$SERIES" --force-distribution --force-bad-version \
              "Automated build of ${GITHUB_SHA} (${GITHUB_REF_NAME})."

      - name: Vendor crates and Lemonade
        run: |
          cargo install --locked cargo-vendor-filterer || true
          export PATH="$HOME/.cargo/bin:$PATH"
          make vendor

      - name: Build source package
        run: dpkg-buildpackage -S -sa -d -us -uc

      - name: Sign
        run: |
          debsign -k"${{ steps.gpg.outputs.keyid }}" \
            -p"gpg --batch --pinentry-mode loopback --passphrase-file $RUNNER_TEMP/passphrase" \
            ../umoja-desktop_*_source.changes

      # See the note at the top: never supersede an edge build in flight.
      - name: Wait for edge builds in flight
        if: steps.version.outputs.ppa == env.EDGE_PPA
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys, time, urllib.parse, urllib.request
          archive = "https://api.launchpad.net/devel/~ken-vandine/+archive/ubuntu/umoja-edge"
          states = ["Needs building", "Currently building",
                    "Gathering build output", "Uploading build"]
          def in_flight():
              found = []
              for state in states:
                  q = urllib.parse.urlencode({"ws.op": "getBuildRecords",
                      "source_name": "umoja-desktop", "build_state": state,
                      "ws.size": "20"})
                  req = urllib.request.Request(f"{archive}?{q}",
                      headers={"User-Agent": "umoja-packages-workflow"})
                  with urllib.request.urlopen(req, timeout=120) as r:
                      for b in json.load(r)["entries"]:
                          found.append(f"{b['title']} ({state})")
              return found
          deadline = time.time() + 5 * 3600
          errors = 0
          while True:
              try:
                  builds = in_flight()
                  errors = 0
              except Exception as e:
                  # The API answers 503 now and then; keep asking for a while.
                  errors += 1
                  if errors >= 10:
                      print(f"::warning::Could not ask Launchpad about builds ({e}); uploading anyway")
                      sys.exit(0)
                  print(f"Launchpad API error ({e}), retrying", flush=True)
                  time.sleep(60)
                  continue
              if not builds:
                  print("No umoja-desktop builds in flight in the edge PPA")
                  sys.exit(0)
              if time.time() > deadline:
                  print("::warning::Edge builds still in flight after 5 h; uploading anyway")
                  sys.exit(0)
              print("Waiting for: " + "; ".join(builds), flush=True)
              time.sleep(120)
          PY

      - name: Upload to Launchpad
        run: dput "${{ steps.version.outputs.ppa }}" ../umoja-desktop_*_source.changes

      - name: Tag the release
        if: steps.version.outputs.tag != ''
        run: |
          git tag "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Collect
        if: always()
        run: |
          mkdir -p dist
          mv ../umoja-desktop_*.dsc ../umoja-desktop_*.tar.* ../umoja-desktop_*_source.* dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: dist/

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg" "$RUNNER_TEMP/passphrase"

  # The user guide as a PDF (docs/guide -> tools/guide/build-pdf). Every run
  # keeps it as an artifact to look at; releases attach it to the GitHub
  # release. The .debs build their own copy (debian/rules).
  guide:
    name: User guide PDF
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates pandoc weasyprint \
            fonts-ubuntu fonts-noto-color-emoji fonts-dejavu-core dpkg-dev

      - uses: actions/checkout@v4

      - name: Build
        run: tools/guide/build-pdf --out umoja-user-guide.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: user-guide
          path: umoja-user-guide.pdf
          if-no-files-found: error

  guide-release:
    name: Attach the user guide to the release
    needs: [ppa, guide]
    if: needs.ppa.outputs.release != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.ppa.outputs.release }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: user-guide

      - name: Create the release if needed and attach the PDF
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Umoja ${TAG#v}" \
              --notes "Install from ppa:ken-vandine/umoja. The user guide is attached as a PDF."
          gh release upload "$TAG" umoja-user-guide.pdf --repo "$GITHUB_REPOSITORY" --clobber
