# Build the Umoja disk image (image/imagecraft.yaml) with Imagecraft and
# boot it in QEMU with Secure Boot on. Phase 2 of the installer ISO plan;
# the ISO (phase 3) is built from the same root filesystem.
#
# Packages come from ppa:ken-vandine/umoja. Debs that aren't published
# there yet are added from a Packages workflow run ("debs-amd64"):
# - pull requests: the Packages run for the same commit (waits for it),
# - Packages runs on main: that run (workflow_run),
# - manual runs: the run id given as packages_run, or none (PPA only).
#
# Artifacts: umoja-image (umoja.img.zst, kept 7 days),
# umoja-image-boot (screenshots + serial log) and, when there are debs to
# add, the installer ISO: ubuntu-umoja-desktop-vVERSION+HASH_amd64 (the
# .iso, its .sha256 and the .list package manifest, kept 7 days) plus the
# .list on its own, unzipped.
#
# Releases: when the commit built is a release (tagged v<debian/changelog
# version>, as the Packages workflow's "release" run does), the ISO is
# named ubuntu-umoja-desktop-vVERSION_amd64 and the "Publish" job uploads
# it, its .sha256 and .list to Cloudflare R2 (releases/vVERSION/), then
# latest.json, and links it from the GitHub release. The downloads Worker
# (infra/downloads) serves and counts them. Secrets: CLOUDFLARE_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY; variables: R2_BUCKET (default
# umoja-releases), DOWNLOAD_URL (the Worker's address, for the release
# notes). Without the secrets the job warns and does nothing.

name: Image

on:
  pull_request:
    paths:
      - image/**
      - .github/workflows/image.yml
      - debian/control
      - packaging/meta/**
  workflow_run:
    workflows: [Packages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      packages_run:
        description: Packages workflow run id whose debs-amd64 to add (empty = PPA only)
        default: ""

# Release runs come from a manual Packages run, edge runs from pushes: keep
# them in separate groups so a push to main never cancels a release ISO.
concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}-${{ github.event.workflow_run.event || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  image:
    name: Build and boot the image (amd64)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      iso: ${{ steps.iso.outputs.name }}
      release: ${{ steps.iso.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || '' }}
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Find the debs to add
        id: debs
        run: |
          run=""
          case "${{ github.event_name }}" in
            workflow_dispatch) run="${{ inputs.packages_run }}" ;;
            workflow_run) run="${{ github.event.workflow_run.id }}" ;;
            pull_request)
              sha="${{ github.event.pull_request.head.sha }}"
              # Wait (up to 2 hours) for this commit's Packages run.
              for i in $(seq 1 120); do
                line=$(gh run list -R "$GITHUB_REPOSITORY" --workflow packages.yml --commit "$sha" \
                  --json databaseId,status,conclusion --jq '.[0] | "\(.databaseId) \(.status) \(.conclusion)"')
                set -- $line
                if [ "${2:-}" = completed ]; then
                  [ "$3" = success ] || { echo "Packages run $1 finished: $3" >&2; exit 1; }
                  run=$1; break
                fi
                echo "waiting for Packages (${line:-not started})"; sleep 60
              done
              [ -n "$run" ] || { echo "no Packages run for $sha" >&2; exit 1; }
              ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Download the debs
        if: steps.debs.outputs.run != ''
        run: |
          gh run download -R "$GITHUB_REPOSITORY" "${{ steps.debs.outputs.run }}" -n debs-amd64 -D dist
          mkdir -p image/local-debs
          # Only the packages the image installs; -dbgsym and test debs stay out.
          for p in ubuntu-umoja-desktop umoja-desktop umoja-greeter umoja-archive-keyring; do
            cp dist/${p}_*.deb image/local-debs/
          done
          ls -l image/local-debs

      - name: Install LXD and Imagecraft
        run: |
          # The snap store sometimes times out (HTTP 408) or is unreachable
          # for a while; keep retrying for up to ~20 minutes.
          sudo snap wait system seed.loaded
          retry() { for i in $(seq 1 15); do "$@" && return 0; echo "retry $i: $*"; sleep 60; done; return 1; }
          retry sudo snap install lxd
          sudo lxd waitready
          sudo lxd init --auto
          # Docker on the runner sets the FORWARD policy to DROP, which cuts
          # LXD containers off the network (as canonical/setup-lxd works
          # around).
          sudo iptables -P FORWARD ACCEPT
          sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT || true
          sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT || true
          sudo usermod -aG lxd "$USER"
          retry sudo snap install imagecraft --classic
          imagecraft version

      - name: Build the image
        working-directory: image
        run: |
          ./prepare
          sg lxd -c 'imagecraft pack --verbose'
          ls -l *.img

      - name: Boot it with Secure Boot on
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf imagemagick
          sudo chmod 666 /dev/kvm || true
          image/test/boot-vm image/umoja.img boot 240

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umoja-image-boot
          path: boot/
          if-no-files-found: ignore

      # The installer ISO, from the image just booted plus this run's debs
      # (it needs their umoja-installer). Named like image/build-local's,
      # with a package manifest (NAME.list: "package version" per line).
      - name: Build the installer ISO
        id: iso
        if: steps.debs.outputs.run != ''
        run: |
          sudo apt-get install -y -q xorriso mtools dosfstools squashfs-tools
          mkdir -p iso-debs iso
          for p in ubuntu-umoja-desktop umoja-desktop umoja-greeter umoja-archive-keyring umoja-installer; do
            cp dist/${p}_*.deb iso-debs/
          done
          version=$(sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p' debian/changelog)
          # The commit built, not the pull request's merge commit.
          sha="${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}"
          name="ubuntu-umoja-desktop-v${version}+${sha:0:8}_amd64"
          # A release: the commit carries the v<version> tag (the Packages
          # release run pushes it before it finishes).
          tagged=$(git rev-parse -q --verify "refs/tags/v${version}^{commit}" || true)
          if [ "$tagged" = "$(git rev-parse HEAD)" ] && [ "${{ github.event_name }}" != pull_request ]; then
            name="ubuntu-umoja-desktop-v${version}_amd64"
            echo "release=v${version}" >> "$GITHUB_OUTPUT"
          fi
          sudo image/iso/build image/umoja.img iso-debs "iso/$name.iso"
          sudo chown -R "$(id -u):$(id -g)" iso
          (cd iso && sha256sum "$name.iso" > "$name.iso.sha256")
          ls -l iso
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.iso.outputs.name != ''
        with:
          name: ${{ steps.iso.outputs.name }}
          path: iso/
          retention-days: 7
          compression-level: 0

      # The manifest on its own too, unzipped, to read in the browser.
      - uses: actions/upload-artifact@v7
        if: steps.iso.outputs.name != ''
        with:
          path: iso/${{ steps.iso.outputs.name }}.list
          archive: false
          retention-days: 7

      - name: Compress the image
        run: |
          zstd -T0 -10 --rm image/umoja.img -o umoja.img.zst
          ls -l umoja.img.zst

      - uses: actions/upload-artifact@v4
        with:
          name: umoja-image
          path: umoja.img.zst
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish the release ISO to R2
    needs: image
    if: needs.image.outputs.release != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.image.outputs.release }}
      NAME: ${{ needs.image.outputs.iso }}
      BUCKET: ${{ vars.R2_BUCKET || 'umoja-releases' }}
      DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_DEFAULT_REGION: auto
      # R2 doesn't take the CRC checksums newer AWS CLIs send by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Check the secrets
        id: secrets
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::warning::R2 secrets are not set; $NAME.iso is not published (see infra/downloads/README.md)"
            exit 0
          fi
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ok
        with:
          name: ${{ needs.image.outputs.iso }}
          path: iso

      - name: Upload to R2
        if: steps.secrets.outputs.ok
        working-directory: iso
        run: |
          ls -l
          sha256sum -c "$NAME.iso.sha256"
          r2() { aws s3 --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" "$@"; }
          dest="s3://$BUCKET/releases/$TAG"
          r2 cp "$NAME.iso" "$dest/$NAME.iso" --content-type application/x-iso9660-image --no-progress
          r2 cp "$NAME.iso.sha256" "$dest/$NAME.iso.sha256" --content-type text/plain --no-progress
          r2 cp "$NAME.list" "$dest/$NAME.list" --content-type "text/plain; charset=utf-8" --no-progress
          # Last, so /latest only moves once the files are all there.
          jq -n --arg tag "$TAG" --arg iso "$NAME.iso" \
            --arg sha256 "$(cut -d' ' -f1 "$NAME.iso.sha256")" \
            --argjson size "$(stat -c %s "$NAME.iso")" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag: $tag, version: ($tag | ltrimstr("v")), iso: $iso, sha256: $sha256, size: $size, published: $published}' \
            > latest.json
          cat latest.json
          r2 cp latest.json "s3://$BUCKET/latest.json" --content-type application/json --no-progress
          r2 ls "$dest/"

      - name: Link it from the GitHub release
        if: steps.secrets.outputs.ok && env.DOWNLOAD_URL != ''
        run: |
          url="${DOWNLOAD_URL%/}/releases/$TAG/$NAME.iso"
          sha=$(cut -d' ' -f1 iso/$NAME.iso.sha256)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Umoja ${TAG#v}" --notes "Install from ppa:ken-vandine/umoja."
          notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          case "$notes" in *"$url"*) exit 0 ;; esac
          printf '%s\n\n**Installer ISO:** [%s](%s) (%s GiB)  \nSHA-256: `%s`\n' \
            "$notes" "$NAME.iso" "$url" "$(numfmt --to-unit=1073741824 --format=%.1f "$(stat -c %s iso/$NAME.iso)")" "$sha" \
            > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
